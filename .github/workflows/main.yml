name: 'CI/CD'
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Create ESLint Configuration
        run: |
          cat > .eslintrc.js << 'EOF'
          module.exports = {
            env: {
              browser: true,
              es2021: true,
              node: true
            },
            extends: [
              'standard'
            ],
            parserOptions: {
              ecmaVersion: 'latest',
              sourceType: 'module'
            },
            rules: {
              'quotes': ['error', 'single'],
              'semi': ['error', 'never'],
              'no-unused-vars': ['error', { 'argsIgnorePattern': '^_' }]
            }
          }
          EOF
          
      - name: Install and Run Linter
        run: |
          npm init -y
          npm install eslint eslint-config-standard eslint-plugin-import eslint-plugin-n eslint-plugin-promise
          
          echo "=== Verificando qué archivos JavaScript existen ==="
          find . -name "*.js" -type f | head -20
          
          echo "=== Auto-corrigiendo errores automáticos ==="
          if [ -f "./secondChance-backend/app.js" ]; then
            ./node_modules/.bin/eslint --fix ./secondChance-backend/app.js || true
          fi
          
          echo "=== Analizando app.js ==="
          if [ -f "./secondChance-backend/app.js" ]; then
            ./node_modules/.bin/eslint ./secondChance-backend/app.js
          else
            echo "❌ app.js no encontrado"
          fi
          
          # Estas líneas están comentadas - las descomentaremos paso a paso:
          # echo "=== Analizando auth.js ==="
          # ./node_modules/.bin/eslint ./secondChance-backend/auth.js
          
          # ARCHIVO QUE NO EXISTE - comentado de nuevo:
          # echo "=== Analizando secondChanceItemsRoutes.js ==="  
          # ./node_modules/.bin/eslint ./secondChance-backend/secondChanceItemsRoutes.js
          
          # PRÓXIMA LÍNEA DESCOMENTADA: logger.js (sí existe)
          echo "=== Analizando logger.js ==="
          if [ -f "./secondChance-backend/logger.js" ]; then
            ./node_modules/.bin/eslint --fix ./secondChance-backend/logger.js || true
            ./node_modules/.bin/eslint ./secondChance-backend/logger.js
          else
            echo "❌ logger.js no encontrado"
          fi
          
          # echo "=== Analizando searchRoutes.js ==="
          # ./node_modules/.bin/eslint ./secondChance-backend/searchRoutes.js
          
          # echo "=== Analizando models/db.js ==="
          # ./node_modules/.bin/eslint ./secondChance-backend/models/db.js
          
          # echo "=== Analizando sentiment/index.js ==="
          # ./node_modules/.bin/eslint ./sentiment/index.js
          
          # echo "=== Analizando sentiment/logger.js ==="
          # ./node_modules/.bin/eslint ./sentiment/logger.js
          
          echo "✅ Proceso de linting completado"
